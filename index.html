<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An interactive quiz about AI, Git, testing, CSS, and time complexity.">
    <title>Code With AI Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="top-bar">
        <span class="brand">Code With AI</span>
        <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false">
            Switch to Dark Mode
        </button>
    </header>

    <main class="page">
        <section class="quiz-card" aria-labelledby="pageTitle">
            <p class="eyebrow">Test your knowledge</p>
            <h1 id="pageTitle">Code With AI Quiz</h1>
            <p class="intro">Five quick questions on AI and software development.</p>

            <div class="progress-row">
                <span id="questionCounter">Question 1 of 5</span>
                <span id="scoreCounter">Score: 0</span>
            </div>
            <div class="progress-track" aria-hidden="true">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <div id="quiz" aria-live="polite">
                <h2 id="question"></h2>
                <div id="options" class="options"></div>
                <p id="feedback" class="feedback" role="status"></p>
            </div>

            <div class="quiz-actions">
                <button id="nextButton" class="primary-button" type="button" hidden>Next Question</button>
                <button id="restartButton" class="primary-button" type="button" hidden>Restart Quiz</button>
            </div>
            <p id="result" class="result" role="status"></p>
        </section>
        <footer>Made for learning • HTML, CSS and JavaScript</footer>
    </main>
</body>
</html>
